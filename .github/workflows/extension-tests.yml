name: Extension compatibility tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22.13.0'
  PYTHON_VERSION: '3.11'
  VSIX_NAME: bug-dhor-0.1.0.vsix

jobs:
  lint:
    name: lint-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: ESLint
        id: lint
        run: npm --workspace vscode-extension run lint
      - name: Write lint evidence
        if: ${{ always() }}
        env:
          GATE_NAME: lint-${{ matrix.os }}
          GATE_STATUS: ${{ steps.lint.outcome }}
        run: |
          node -e '
          const fs = require("node:fs");
          const payload = {
            schema_version: 1,
            gate: process.env.GATE_NAME,
            status: process.env.GATE_STATUS === "success" ? "pass" : "fail",
            commit_sha: process.env.GITHUB_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            generated_at: new Date().toISOString()
          };
          fs.mkdirSync("artifacts/evidence", { recursive: true });
          fs.writeFileSync(`artifacts/evidence/${process.env.GATE_NAME}.json`, JSON.stringify(payload, null, 2) + "\n");
          '
      - name: Upload lint evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-lint-${{ matrix.os }}
          path: artifacts/evidence/lint-${{ matrix.os }}.json
          if-no-files-found: error

  unit:
    name: unit-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Extension unit tests
        id: unit
        run: npm --workspace vscode-extension test
      - name: Write unit evidence
        if: ${{ always() }}
        env:
          GATE_NAME: unit-${{ matrix.os }}
          GATE_STATUS: ${{ steps.unit.outcome }}
        run: |
          node -e '
          const fs = require("node:fs");
          const payload = {
            schema_version: 1,
            gate: process.env.GATE_NAME,
            status: process.env.GATE_STATUS === "success" ? "pass" : "fail",
            commit_sha: process.env.GITHUB_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            generated_at: new Date().toISOString()
          };
          fs.mkdirSync("artifacts/evidence", { recursive: true });
          fs.writeFileSync(`artifacts/evidence/${process.env.GATE_NAME}.json`, JSON.stringify(payload, null, 2) + "\n");
          '
      - name: Upload unit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-unit-${{ matrix.os }}
          path: artifacts/evidence/unit-${{ matrix.os }}.json
          if-no-files-found: error

  package:
    name: package-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: vsix-macos
          - os: windows-latest
            artifact: vsix-windows
          - os: ubuntu-latest
            artifact: vsix-ubuntu
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Node dependencies
        run: npm ci
      - name: List package contents
        id: package-list
        run: npm --workspace vscode-extension run package:list
      - name: Build VSIX
        id: package-build
        run: npm --workspace vscode-extension run package:vsix
      - name: Validate VSIX contents
        id: package-validate
        run: |
          VSIX="vscode-extension/${VSIX_NAME}"
          python -m zipfile -l "$VSIX" > vsix-contents.txt
          grep -q 'extension/package.json' vsix-contents.txt
          grep -q 'extension/readme.md' vsix-contents.txt
          grep -q 'extension/changelog.md' vsix-contents.txt
          grep -q 'extension/src/extension.js' vsix-contents.txt
          grep -q 'extension/media/icon.png' vsix-contents.txt
          grep -q 'extension/node_modules/ajv/package.json' vsix-contents.txt
          if grep -Fq 'extension/test/' vsix-contents.txt; then
            echo 'VSIX must not contain test files.' >&2
            exit 1
          fi
          if grep -Fq '../' vsix-contents.txt; then
            echo 'VSIX must not contain parent-path entries.' >&2
            exit 1
          fi
          if grep -Fq 'extension/node_modules/@vscode/' vsix-contents.txt; then
            echo 'VSIX must not contain development dependencies.' >&2
            exit 1
          fi
          node -e "const fs=require('node:fs'); const s=fs.statSync(process.argv[1]).size; if(s<100000||s>2000000){throw new Error('unexpected VSIX size: '+s)} console.log('VSIX bytes: '+s)" "$VSIX"
      - name: Write package evidence
        if: ${{ always() }}
        env:
          GATE_NAME: package-${{ matrix.os }}
          LIST_OUTCOME: ${{ steps.package-list.outcome }}
          BUILD_OUTCOME: ${{ steps.package-build.outcome }}
          VALIDATE_OUTCOME: ${{ steps.package-validate.outcome }}
        run: |
          node -e '
          const fs = require("node:fs");
          const outcomes = [process.env.LIST_OUTCOME, process.env.BUILD_OUTCOME, process.env.VALIDATE_OUTCOME];
          const payload = {
            schema_version: 1,
            gate: process.env.GATE_NAME,
            status: outcomes.every((value) => value === "success") ? "pass" : "fail",
            commit_sha: process.env.GITHUB_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            generated_at: new Date().toISOString()
          };
          fs.mkdirSync("artifacts/evidence", { recursive: true });
          fs.writeFileSync(`artifacts/evidence/${process.env.GATE_NAME}.json`, JSON.stringify(payload, null, 2) + "\n");
          '
      - name: Upload package evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-package-${{ matrix.os }}
          path: artifacts/evidence/package-${{ matrix.os }}.json
          if-no-files-found: error
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: vscode-extension/${{ env.VSIX_NAME }}
          if-no-files-found: error

  integration:
    name: integration-${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: vsix-macos
          - os: windows-latest
            artifact: vsix-windows
          - os: ubuntu-latest
            artifact: vsix-ubuntu
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Node dependencies
        run: npm ci
      - name: Install Linux headless display support
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Create static Python environment
        run: |
          python -m venv .venv
          PY=".venv/bin/python"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=".venv/Scripts/python.exe"
          fi
          "$PY" -m pip install --upgrade pip
          PY_ABS=$(python -c "import os,sys; print(os.path.abspath(sys.argv[1]))" "$PY")
          echo "BUGDHOR_PYTHON=$PY_ABS" >> "$GITHUB_ENV"
          (cd security-engine && "$PY_ABS" -m pip install -e ".[dev]")
      - name: Extension Host integration tests
        id: integration-test
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm --workspace vscode-extension run test:integration
          else
            npm --workspace vscode-extension run test:integration
          fi
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: vsix
      - name: VSIX installation smoke test
        id: integration-vsix
        run: |
          # Git Bash pwd emits an MSYS path (/d/a/...) on Windows. Resolve the
          # artifact with native Node path rules so the VS Code CLI receives a
          # usable Windows path while POSIX runners keep the same strategy.
          VSIX="$(node -p "require('node:path').resolve('vsix', process.argv[1])" "$VSIX_NAME")"
          if [ "$RUNNER_OS" = "Linux" ]; then
            BUGDHOR_VSIX_PATH="$VSIX" xvfb-run -a npm --workspace vscode-extension run test:integration:vsix
          else
            BUGDHOR_VSIX_PATH="$VSIX" npm --workspace vscode-extension run test:integration:vsix
          fi
      - name: Write integration evidence
        if: ${{ always() }}
        env:
          GATE_NAME: integration-${{ matrix.os }}
          TEST_OUTCOME: ${{ steps.integration-test.outcome }}
          VSIX_OUTCOME: ${{ steps.integration-vsix.outcome }}
        run: |
          node -e '
          const fs = require("node:fs");
          const outcomes = [process.env.TEST_OUTCOME, process.env.VSIX_OUTCOME];
          const payload = {
            schema_version: 1,
            gate: process.env.GATE_NAME,
            status: outcomes.every((value) => value === "success") ? "pass" : "fail",
            commit_sha: process.env.GITHUB_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            generated_at: new Date().toISOString()
          };
          fs.mkdirSync("artifacts/evidence", { recursive: true });
          fs.writeFileSync(`artifacts/evidence/${process.env.GATE_NAME}.json`, JSON.stringify(payload, null, 2) + "\n");
          '
      - name: Upload integration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-integration-${{ matrix.os }}
          path: artifacts/evidence/integration-${{ matrix.os }}.json
          if-no-files-found: error

  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install engine dev and ML dependencies
        run: python -m pip install --disable-pip-version-check -e 'security-engine[dev,ml]'
      # Root tests import src/bugdhor_ast, whose language grammars are outside
      # the engine package and are pinned in this repository-level file.
      - name: Install root AST test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ast.txt
      # The committed decoder-column bundle is the portable substitute for the
      # ~100 MiB full SAE checkpoints, which are intentionally not distributed.
      - name: Verify decoder fixture manifest
        run: |
          PYTHONPATH=research/experiments/counterfactual_validation python - <<'PY'
          from artifact_paths import ARTIFACT_ROOT, artifact_path, load_manifest, sha256_file
          manifest = load_manifest()
          for fixture_id, entry in manifest["files"].items():
              path = artifact_path(entry["path"])
              if not path.is_file():
                  raise SystemExit(f"missing fixture {fixture_id}: {path}")
              actual = sha256_file(path)
              if actual != entry["sha256"]:
                  raise SystemExit(
                      f"checksum mismatch for {fixture_id}: expected {entry['sha256']}, got {actual}"
                  )
          print(f"verified {len(manifest['files'])} decoder fixtures under {ARTIFACT_ROOT}")
          PY
      - name: Run Python tests
        id: pytest
        run: |
          set -uo pipefail
          mkdir -p artifacts
          PYTHONPATH=src:security-engine/src python -m pytest -q -m "not real_model_integration" 2>&1 | tee artifacts/python-tests.log
          exit "${PIPESTATUS[0]}"
      - name: Write Python test evidence
        if: ${{ always() }}
        env:
          GATE_STATUS: ${{ steps.pytest.outcome }}
        run: |
          test_count=0
          if [ -f artifacts/python-tests.log ]; then
            test_count="$(node -e 'const fs=require("node:fs"); const text=fs.readFileSync(process.argv[1],"utf8"); const matches=[...text.matchAll(/(\d+) passed/g)]; console.log(matches.length?matches[matches.length-1][1]:"0")' artifacts/python-tests.log)"
          fi
          GATE_NAME=python-tests GATE_STATUS="$GATE_STATUS" TEST_COUNT="$test_count" node -e '
          const fs = require("node:fs");
          const payload = {
            schema_version: 1,
            gate: process.env.GATE_NAME,
            status: process.env.GATE_STATUS === "success" ? "pass" : "fail",
            commit_sha: process.env.GITHUB_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            generated_at: new Date().toISOString(),
            test_count: Number(process.env.TEST_COUNT),
            real_model_integration: {
              status: "not_provisioned",
              reason: "Full SAE checkpoints are not distributed; required cosine recomputation used committed SHA-256-verified decoder-column fixtures."
            }
          };
          fs.mkdirSync("artifacts/evidence", { recursive: true });
          fs.writeFileSync(`artifacts/evidence/${process.env.GATE_NAME}.json`, JSON.stringify(payload, null, 2) + "\n");
          '
      - name: Upload Python test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-python-tests
          path: artifacts/evidence/python-tests.json
          if-no-files-found: error

  python-sca:
    name: python-sca
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install SCA tooling
        run: python -m pip install --disable-pip-version-check "pip-tools==7.7.0" pip-audit
      - name: Install locked dependencies
        id: sca-install
        run: python -m pip install --require-hashes -r security-engine/requirements.lock.txt
      # --disable-pip keeps the fully resolved hash lock frozen for auditing.
      # Without it pip-audit re-resolves the CPU wheel as 2.15.0+cpu, which the
      # PyPI vulnerability service cannot query; --require-hashes and --strict
      # are still enforced for every locked package.
      - name: Audit locked dependencies
        id: sca-audit
        run: pip-audit --require-hashes -r security-engine/requirements.lock.txt --strict --disable-pip
      - name: Write SCA evidence
        if: ${{ always() }}
        env:
          INSTALL_OUTCOME: ${{ steps.sca-install.outcome }}
          AUDIT_OUTCOME: ${{ steps.sca-audit.outcome }}
        run: |
          LOCK_SHA256="$(sha256sum security-engine/requirements.lock.txt | awk '{print $1}')"
          if [ "$INSTALL_OUTCOME" = success ] && [ "$AUDIT_OUTCOME" = success ]; then
            status=success
          else
            status=failure
          fi
          GATE_NAME=python-sca GATE_STATUS="$status" LOCK_SHA256="$LOCK_SHA256" node -e '
          const fs = require("node:fs");
          const payload = {
            schema_version: 1,
            gate: process.env.GATE_NAME,
            status: process.env.GATE_STATUS === "success" ? "pass" : "fail",
            commit_sha: process.env.GITHUB_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            generated_at: new Date().toISOString(),
            lock_sha256: process.env.LOCK_SHA256
          };
          fs.mkdirSync("artifacts/evidence", { recursive: true });
          fs.writeFileSync(`artifacts/evidence/${process.env.GATE_NAME}.json`, JSON.stringify(payload, null, 2) + "\n");
          '
      - name: Upload SCA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-python-sca
          path: artifacts/evidence/python-sca.json
          if-no-files-found: error

  npm-audit:
    name: npm-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Node dependencies
        id: npm-install
        run: npm ci
      - name: Audit production dependencies
        id: npm-audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Write npm audit evidence
        if: ${{ always() }}
        env:
          INSTALL_OUTCOME: ${{ steps.npm-install.outcome }}
          AUDIT_OUTCOME: ${{ steps.npm-audit.outcome }}
        run: |
          if [ "$INSTALL_OUTCOME" = success ] && [ "$AUDIT_OUTCOME" = success ]; then
            status=success
          else
            status=failure
          fi
          GATE_NAME=npm-audit GATE_STATUS="$status" GATE_DETAIL='npm audit --omit=dev --audit-level=moderate' node -e '
          const fs = require("node:fs");
          const payload = {
            schema_version: 1,
            gate: process.env.GATE_NAME,
            status: process.env.GATE_STATUS === "success" ? "pass" : "fail",
            commit_sha: process.env.GITHUB_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            generated_at: new Date().toISOString(),
            detail: process.env.GATE_DETAIL
          };
          fs.mkdirSync("artifacts/evidence", { recursive: true });
          fs.writeFileSync(`artifacts/evidence/${process.env.GATE_NAME}.json`, JSON.stringify(payload, null, 2) + "\n");
          '
      - name: Upload npm audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-npm-audit
          path: artifacts/evidence/npm-audit.json
          if-no-files-found: error

  untrusted-workspace:
    name: untrusted-workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify untrusted-host test script exists
        id: untrusted-script
        run: |
          if ! node -e 'const s=require("./vscode-extension/package.json").scripts||{}; if (!s["test:integration:untrusted"]) process.exit(1)'; then
            echo 'Missing script test:integration:untrusted in vscode-extension/package.json.' >&2
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Node dependencies
        run: npm ci
      - name: Install Linux headless display support
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Create static Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          PY_ABS=$(python -c "import os,sys; print(os.path.abspath(sys.argv[1]))" .venv/bin/python)
          echo "BUGDHOR_PYTHON=$PY_ABS" >> "$GITHUB_ENV"
          (cd security-engine && "$PY_ABS" -m pip install -e ".[dev]")
      - name: Untrusted Extension Host tests
        id: untrusted-test
        run: xvfb-run -a npm --workspace vscode-extension run test:integration:untrusted
      - name: Write untrusted-host evidence
        if: ${{ always() }}
        env:
          SCRIPT_OUTCOME: ${{ steps.untrusted-script.outcome }}
          TEST_OUTCOME: ${{ steps.untrusted-test.outcome }}
        run: |
          if [ "$SCRIPT_OUTCOME" = success ] && [ "$TEST_OUTCOME" = success ]; then
            status=success
          else
            status=failure
          fi
          detail=''
          if [ "$SCRIPT_OUTCOME" != success ]; then
            detail='Missing test:integration:untrusted script'
          fi
          GATE_NAME=untrusted-workspace GATE_STATUS="$status" GATE_DETAIL="$detail" node -e '
          const fs = require("node:fs");
          const payload = {
            schema_version: 1,
            gate: process.env.GATE_NAME,
            status: process.env.GATE_STATUS === "success" ? "pass" : "fail",
            commit_sha: process.env.GITHUB_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            generated_at: new Date().toISOString()
          };
          if (process.env.GATE_DETAIL) {
            payload.detail = process.env.GATE_DETAIL;
          }
          fs.mkdirSync("artifacts/evidence", { recursive: true });
          fs.writeFileSync(`artifacts/evidence/${process.env.GATE_NAME}.json`, JSON.stringify(payload, null, 2) + "\n");
          '
      - name: Upload untrusted-host evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-untrusted-workspace
          path: artifacts/evidence/untrusted-workspace.json
          if-no-files-found: error

  release-manifest:
    name: release-manifest
    if: ${{ always() && !cancelled() }}
    needs:
      - lint
      - unit
      - package
      - integration
      - python-tests
      - python-sca
      - npm-audit
      - untrusted-workspace
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download gate evidence
        uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          path: artifacts/evidence
          merge-multiple: true
      - name: Generate release-gate manifest
        run: |
          node scripts/generateReleaseManifest.js \
            --evidence-dir artifacts/evidence \
            --commit-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --repository "${{ github.repository }}" \
            --output-dir artifacts \
            --max-age-seconds 86400
      - name: Upload release-gate manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-manifest
          path: |
            artifacts/release-gate-manifest.json
            artifacts/release-gate-manifest.json.sha256
          if-no-files-found: error
