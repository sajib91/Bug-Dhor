name: Python dependency SCA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-sca-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: security-engine

env:
  PYTHON_VERSION: '3.11'
  PIP_TOOLS_VERSION: '7.7.0'

jobs:
  lockfile-and-audit:
    name: Verify hash lock and audit dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: security-engine/requirements.lock.txt
      - name: Install SCA tooling
        run: |
          python -m pip install --disable-pip-version-check \
            "pip-tools==${{ env.PIP_TOOLS_VERSION }}" pip-audit
      # The committed lock is the audit target. Regenerating it on a runner is
      # platform-dependent and produced false failures, so install and audit
      # the committed file exactly as it is stored in the repository.
      - name: Record locked requirements digest
        run: sha256sum requirements.lock.txt
      - name: Install dependencies with hash verification
        run: python -m pip install --require-hashes -r requirements.lock.txt
      - name: Audit locked dependencies
        run: pip-audit --require-hashes -r requirements.lock.txt --strict
